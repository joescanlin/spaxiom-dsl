site_name: Spaxiom DSL
site_description: An embedded domain-specific language for spatial sensor fusion, temporal reasoning, and real-time event detection
site_author: Joe Scanlin
repo_url: https://github.com/joescanlin/spaxiom-dsl

theme:
  name: material
  logo: images/intent-logo.svg
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.integrate

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - What's New in 0.1.0: whats_new.md
  - Quick-Start: quickstart.md
  - INTENT: intent.md
  - Architecture: architecture.md
  - Runtime: runtime.md
  - Safety: safety.md
  - Governance: governance.md
  - API:
    - Overview: api/overview.md
  - Temporal: temporal_and_entities.md
  - CLI: cli_usage.md
  - Edge Deployment:
    - Overview: edge.md
    - API Reference: edge_api.md
    - Security: edge_security.md
  - Sensor Onboarding:
    - Overview: sensors/overview.md
    - MQTT: sensors/mqtt.md
    - Zigbee (via MQTT): sensors/zigbee.md
    - Modbus (RTU/TCP): sensors/modbus.md
    - HTTP/REST Webhooks: sensors/http_webhooks.md
    - LoRaWAN: sensors/lorawan.md
    - Z-Wave (via MQTT): sensors/zwave.md
    - Serial (RS-232/RS-485): sensors/serial.md
    - GPIO: sensors/gpio.md
    - File/CSV: sensors/file_csv.md
    - Simulated Sensors: sensors/simulated.md
    - YAML Configuration: sensors/yaml_config.md
  - Examples:
    - Overview: examples/overview.md
    - Smart Building: examples/smart_building.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/joescanlin/spaxiom-dsl

extra_css:
  - css/intent.css 