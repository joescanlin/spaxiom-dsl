<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300&amp;display=swap');
    </style>
  </defs>
  
  <!-- Parallel tasks merging to completion -->
  <g transform="translate(8, 8)">
    <!-- Starting event node -->
    <circle cx="6" cy="22" r="4" fill="#f97316" opacity="0.5"/>
    
    <!-- Split arrow -->
    <line x1="10" y1="22" x2="18" y2="22" stroke="#f97316" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Vertical split bar -->
    <line x1="20" y1="6" x2="20" y2="38" stroke="#f97316" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    
    <!-- Parallel task boxes -->
    <rect x="26" y="0" width="20" height="14" rx="2" stroke="#f97316" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M34 3 L32 7 L35 7 L33 11" stroke="#f97316" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    
    <rect x="26" y="15" width="20" height="14" rx="2" stroke="#f97316" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M34 18 L32 22 L35 22 L33 26" stroke="#f97316" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    
    <rect x="26" y="30" width="20" height="14" rx="2" stroke="#f97316" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M34 33 L32 37 L35 37 L33 41" stroke="#f97316" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    
    <!-- Merge bar -->
    <line x1="52" y1="6" x2="52" y2="38" stroke="#f97316" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    
    <!-- Merge arrow -->
    <line x1="54" y1="22" x2="64" y2="22" stroke="#f97316" stroke-width="2" opacity="0.5"/>
    <path d="M60 18 L66 22 L60 26" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Completion node -->
    <circle cx="74" cy="22" r="4" fill="#f97316"/>
  </g>
  
  <!-- Text: INTENT -->
  <text x="98" y="40" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="300" fill="#000000" letter-spacing="2">INTENT</text>
</svg>
